name: 'Update contributor feedback labels on comment'
on: 'issue_comment'

permissions: {}

jobs:
  feedback:
    if: |
      github.actor != 'github-actions' &&
      github.actor == github.event.issue.user.login &&
      github.event.issue &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'needs: author feedback')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Swap author feedback labels for triage feedback
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const { owner, repo, number: issue_number } = context.issue;

          await github.rest.issues.addLabels( {
            owner,
            repo,
            issue_number,
            labels: [ 'needs: triage feedback' ],
          } );

          for ( const name of [ 'needs: author feedback', 'status: stale' ] ) {
            try {
              await github.rest.issues.removeLabel( { owner, repo, issue_number, name } );
            } catch ( error ) {
              // The label may already be absent; ignore that and rethrow anything else.
              if ( error.status !== 404 ) {
                throw error;
              }
            }
          }
