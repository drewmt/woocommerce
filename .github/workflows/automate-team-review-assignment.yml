name: Add community label, Assign reviewers

on:
    pull_request_target:
        types: [opened, ready_for_review, review_requested]
    issues:
        types: [opened]

concurrency:
    group: automate-team-review-assignment-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.pull_request.number || github.event.issue.number }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    add-community-label:
        name: Add community label
        if: ${{ github.event.action == 'opened' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check if community contribution
              id: check
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  script: |
                      const username = '${{ github.event.pull_request.user.login || github.event.issue.user.login }}';
                      const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel( {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          username: username,
                      } );
                      const contributor = ( permission === 'read' || permission === 'none' ) && username !== 'gglobalstep' && username !== 'linear[bot]';
                      core.setOutput( 'contributor', contributor ? 'yes' : 'no' );

            - name: Add community label
              if: ${{ steps.check.outputs.contributor == 'yes' }}
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
              with:
                  script: |
                      github.rest.issues.addLabels({
                          issue_number: ${{ github.event.pull_request.number || github.event.issue.number }},
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          labels: [ 'type: community contribution' ]
                      });

    assign-reviewers:
      name: Assign reviewers
      if: ${{ github.event.pull_request && ( github.event.action == 'opened' || github.event.action == 'ready_for_review' ) }}
      runs-on: ubuntu-latest
      steps:
        - name: Check if community contribution
          id: check
          uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
          with:
            retries: 2
            script: |
              const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel( {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: '${{ github.event.pull_request.user.login }}',
              } );
              core.setOutput( 'contributor', ( permission === 'read' || permission === 'none' ) ? 'yes' : 'no' );

        - name: Assign reviewers for a community PR
          if: ${{ steps.check.outputs.contributor == 'yes' && github.event.pull_request.draft == false }}
          uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
          with:
              github-token: ${{ secrets.PR_ASSIGN_TOKEN }}
              script: |
                  const { owner, repo } = context.repo;
                  const pull_number = context.payload.pull_request.number;
                  const author = context.payload.pull_request.user.login;

                  // Load the path -> reviewers map from the PR's base branch, which is trusted
                  // even on pull_request_target since it is never the contributor's fork.
                  const { data: file } = await github.rest.repos.getContent( {
                      owner,
                      repo,
                      path: '.github/project-community-pr-assigner.json',
                      ref: context.payload.pull_request.base.sha,
                  } );
                  const { assignments } = JSON.parse(
                      Buffer.from( file.content, 'base64' ).toString( 'utf8' )
                  );

                  const changedFiles = await github.paginate( github.rest.pulls.listFiles, {
                      owner,
                      repo,
                      pull_number,
                      per_page: 100,
                  } );
                  const paths = changedFiles.map( ( f ) => f.filename );

                  // Translate a glob to a RegExp with the same semantics the previous action used:
                  // * matches within a path segment, ** matches across segments, and a leading **/
                  // may also match zero segments.
                  const specialChars = /[.+?^${}()|[\]\\]/;
                  const globToRegExp = ( glob ) => {
                      let source = '';
                      for ( let i = 0; i < glob.length; i++ ) {
                          const char = glob[ i ];
                          if ( char === '*' ) {
                              if ( glob[ i + 1 ] === '*' ) {
                                  i++;
                                  if ( glob[ i + 1 ] === '/' ) {
                                      i++;
                                      source += '(?:.*/)?';
                                  } else {
                                      source += '.*';
                                  }
                              } else {
                                  source += '[^/]*';
                              }
                          } else if ( specialChars.test( char ) ) {
                              source += '\\' + char;
                          } else {
                              source += char;
                          }
                      }
                      return new RegExp( '^' + source + '$' );
                  };

                  const reviewers = new Set();
                  const teamReviewers = new Set();
                  for ( const [ glob, entries ] of Object.entries( assignments ) ) {
                      const matcher = globToRegExp( glob );
                      if ( ! paths.some( ( path ) => matcher.test( path ) ) ) {
                          continue;
                      }
                      for ( const entry of entries ) {
                          if ( typeof entry === 'string' ) {
                              reviewers.add( entry );
                          } else if ( entry && entry.team ) {
                              teamReviewers.add( entry.team );
                          }
                      }
                  }

                  // GitHub rejects a review request that includes the PR author.
                  reviewers.delete( author );

                  if ( reviewers.size === 0 && teamReviewers.size === 0 ) {
                      core.info( 'No reviewers matched the changed files.' );
                      return;
                  }

                  const requestReviewers = ( reviewersList, teamReviewersList ) =>
                      github.rest.pulls.requestReviewers( {
                          owner,
                          repo,
                          pull_number,
                          reviewers: reviewersList,
                          team_reviewers: teamReviewersList,
                      } );

                  try {
                      await requestReviewers( [ ...reviewers ], [ ...teamReviewers ] );
                  } catch ( error ) {
                      // A single invalid entry rejects the whole batch, so fall back to
                      // requesting each reviewer on its own and skip only the bad ones.
                      core.warning(
                          `Batch review request failed (${ error.message }); retrying individually.`
                      );
                      for ( const reviewer of reviewers ) {
                          try {
                              await requestReviewers( [ reviewer ], [] );
                          } catch ( individualError ) {
                              core.warning(
                                  `Could not request reviewer ${ reviewer }: ${ individualError.message }`
                              );
                          }
                      }
                      for ( const team of teamReviewers ) {
                          try {
                              await requestReviewers( [], [ team ] );
                          } catch ( individualError ) {
                              core.warning(
                                  `Could not request team ${ team }: ${ individualError.message }`
                              );
                          }
                      }
                  }

        - name: Assign reviewers for a teams PR
          if: ${{ steps.check.outputs.contributor == 'no' && github.event.pull_request.draft == false && ! contains( github.event.pull_request.labels.*.name, 'Release' ) && ( github.event.pull_request.base.ref == 'trunk' || startsWith( github.event.pull_request.base.ref, 'release/' ) ) }}
          continue-on-error: ${{ ( github.event.pull_request.head.repo.fork && 'true' ) || 'false' }}
          uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
          with:
              github-token: ${{ secrets.PR_ASSIGN_TOKEN }}
              script: |
                  const { owner, repo } = context.repo;
                  const pull_number = context.payload.pull_request.number;
                  const author = context.payload.pull_request.user.login;

                  // Author's team -> reviewing team. Mirrors the removed
                  // .github/automate-team-review-assignment-config.yml: a PR from a member of
                  // one of these teams is routed back to that same team for review.
                  const teams = [ 'rubik', 'woo-fse', 'ballade' ];

                  const teamReviewers = [];
                  for ( const team of teams ) {
                      try {
                          const { data: membership } =
                              await github.rest.teams.getMembershipForUserInOrg( {
                                  org: owner,
                                  team_slug: team,
                                  username: author,
                              } );
                          if ( membership.state === 'active' ) {
                              teamReviewers.push( team );
                          }
                      } catch ( error ) {
                          // 404 means the author is not a member of this team; anything else is unexpected.
                          if ( error.status !== 404 ) {
                              throw error;
                          }
                      }
                  }

                  if ( teamReviewers.length === 0 ) {
                      core.info( `${ author } is not a member of an auto-assigned team.` );
                      return;
                  }

                  try {
                      await github.rest.pulls.requestReviewers( {
                          owner,
                          repo,
                          pull_number,
                          team_reviewers: teamReviewers,
                      } );
                  } catch ( error ) {
                      core.warning( `Failed to request team reviewers: ${ error.message }` );
                  }

    add-testing-instructions-review-comment:
      name: Remind reviewers to also review the testing instructions and test coverage
      if: ${{ github.event.pull_request && github.event.action == 'review_requested' }}
      runs-on: ubuntu-latest
      steps:
        - name: Check if community contribution
          id: check
          uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
          with:
            retries: 2
            script: |
              const { data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel( {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: '${{ github.event.pull_request.user.login }}',
              } );
              core.setOutput( 'contributor', ( permission === 'read' || permission === 'none' ) ? 'yes' : 'no' );

        - name: Get the username of requested reviewers
          if: ${{ steps.check.outputs.contributor == 'no' }}
          id: get_reviewer_username
          run: |
              # Retrieves the username of all reviewers and stores them in a comma-separated list
              reviewers=$(echo '${{ toJson(github.event.pull_request.requested_reviewers[*].login) }}' | jq -r 'map("@\(.)") | join(" ")')
              echo "REVIEWERS=$reviewers" >> $GITHUB_ENV

        - name: Get the name of requested teams
          id: get_team_name
          run: |
              # Retrieves the name of all teams asked for review and stores them in a comma-separated list
              teams=$(echo '${{ toJson(github.event.pull_request.requested_teams[*].slug) }}' | jq -r 'map("@woocommerce/\(.)") | join(" ")')
              echo "TEAMS=$teams" >> $GITHUB_ENV

        - name: Find the comment by github-actions[bot] asking for reviewing the testing instructions
          uses: peter-evans/find-comment@034abe94d3191f9c89d870519735beae326f2bdb
          id: find-comment
          with:
              issue-number: ${{ github.event.pull_request.number }}
              comment-author: 'github-actions[bot]'
              body-includes: Apart from reviewing the code changes

        - name: Create or update PR comment asking for reviewers to review the testing instructions and test coverage
          uses: peter-evans/create-or-update-comment@67dcc547d311b736a8e6c5c236542148a47adc3d
          with:
              comment-id: ${{ steps.find-comment.outputs.comment-id }}
              issue-number: ${{ github.event.pull_request.number }}
              body: |
                  ## Testing Guidelines
                  Hi ${{ env.REVIEWERS }} ${{ env.TEAMS }},

                  Apart from reviewing the code changes, please make sure to **review the testing instructions** ([Guide](https://developer.woocommerce.com/docs/contribution/testing/writing-high-quality-testing-instructions)) and verify that relevant tests (E2E, Unit, Integration, etc.) have been added or updated as needed.

                  **Reminder:** PR reviewers are required to document testing performed. This includes:
                  - 🖼️ **Screenshots or screen recordings**.
                  - 📝 **List of functionality tested / steps followed**.
                  - 🌐 **Site details** (environment attributes such as hosting type, plugins, theme, store size, store age, and relevant settings).
                  - 🔍 **Any analysis performed**, such as assessing potential impacts on environment attributes and other plugins, conducting performance profiling, or using LLM/AI-based analysis.

                  ⚠️ Within the testing details you provide, please ensure that no sensitive information (such as API keys, passwords, user data, etc.) is included in this public issue.
              edit-mode: replace
